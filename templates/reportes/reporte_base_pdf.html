<!DOCTYPE html>
<html>
<head>
    <title>{% block pdf_title %}{{ titulo }}{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 10pt; margin: 0.5in; }
        h1 { font-size: 16pt; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .header { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .info { font-size: 10pt; }
        
        @page {
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-size: 8pt;
                color: #666;
                vertical-align: top;
                padding-top: 5px;
            }
        }
    </style>
    {% block pdf_head_extra %}{% endblock %}
</head>
<body>
    <div class="header">
        <h1>{% block report_header_title %}{{ titulo }}{% endblock %}</h1>
        <p class="info">Fecha de Generación: {{ fecha_generacion }}</p>
        {% block report_filters %}{% endblock %}
    </div>

    {% block report_content %}{% endblock %}

</body>
</html>
